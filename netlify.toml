[build]
publish = "dist"
command = "npm run build"

[[plugins]]
package = "@netlify/plugin-sitemap"

  [plugins.inputs]
  buildDir = "dist"
  prettyURLs = true
  # Append missing trailing slash to pretty URL
  trailingSlash = true
  changeFreq = "weekly"
  priority = 0.5
  
[[redirects]]
from = "/fundamentals/collections/array/"
to = "/array/"
status = 301
force = true

